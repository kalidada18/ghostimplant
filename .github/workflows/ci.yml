name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol-tests:
    name: Protocol tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server deps
        run: pip install -r server/requirements.txt
      - name: Run end-to-end channel protocol test
        run: python tests/test_protocol.py

  build-implant:
    name: Cross-compile implant (MinGW-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Build release implant
        run: C2_HOST=ci-build.example.invalid C2_PORT=443 GHOST_BEACON_TOKEN=ci-build-token-not-for-operational-use ./build.sh
      - name: Verify artifact
        run: test -f build/WindowsSecurityUpdate.exe && file build/WindowsSecurityUpdate.exe
      # XS/XSW folding is a compiler optimisation, not a language guarantee.
      # This step is the tripwire that keeps the README's "no URLs, no payload
      # fragments, no secrets in the clear" claim measured rather than assumed.
      - name: Assert no plaintext protocol strings or secrets in the artifact
        run: |
          python3 tests/check_strings.py build/WindowsSecurityUpdate.exe \
            --secret "ci-build-token-not-for-operational-use" \
            --secret "ci-build.example.invalid"

  detection-artifacts:
    name: Detection artifacts (Sigma + Sysmon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detector tooling
        run: pip install -r detections/requirements.txt
      # Fails on malformed rules, duplicate or non-canonical UUIDs, a condition
      # naming an undefined selector, a selector nothing references, a rule whose
      # Sysmon event id the collector config does not enable, and any README
      # technique with neither a rule nor a stated reason for the gap.
      - name: Validate rules and coverage accounting
        run: python detections/check_coverage.py --report
