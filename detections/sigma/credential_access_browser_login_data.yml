title: GHOST Lab - Browser Credential Store Read Via winsqlite3
id: 8b2d5f61-3e97-40ac-a8c4-6d1e5f93b027
status: experimental
description: >
  Detects the Chrome/Edge credential extraction path in src/c2.cpp. The
  implant copies "Login Data" and "Local State" out of the browser profile,
  opens the copy with winsqlite3.dll (which ships in System32, so no
  third-party sqlite binary appears), and decrypts os_crypt with BCrypt AES-256-GCM
  after unwrapping the DPAPI master key. winsqlite3.dll being loaded by a
  process that is not a browser is the cleanest available signal, because the
  file-copy and DPAPI calls are either unlogged or extremely noisy.
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: kalidada18
date: 2026-10-07
tags:
  - attack.credential_access
  - attack.t1555.003
logsource:
  product: windows
  service: sysmon
detection:
  selection_sqlite_load:
    EventID: 7
    ImageLoaded|endswith: '\winsqlite3.dll'
  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\browser.exe'
  selection_profile_copy:
    EventID: 11
    TargetFilename|contains:
      - '\Login Data'
      - '\Local State'
  filter_browser_temp:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
  condition: (selection_sqlite_load and not filter_browsers) or (selection_profile_copy and not filter_browser_temp)
falsepositives:
  - Some installers and backup agents read Chromium profile files and may load
    winsqlite3. The credential path also requires DPAPI use, which
    legitimately happens in many apps, so do not escalate on the
    selection_profile_copy arm alone - treat the DLL-load arm as the trigger
    and the copy arm as corroboration.
  - A documented limitation carried from the code itself is that Chrome 127 and
    later use app-bound encryption ("v20" blobs) which the implant reports as
    not recoverable, so an experiment against a current Chrome may produce no
    credential event at all. Absence of detection there is not a detection
    success.
level: high
