title: GHOST Lab - WindowsSecurityUpdate.exe Created Or Executed
id: 9e5b3a17-6d42-4c80-b17f-5a2d8e94c036
status: experimental
description: >
  Detects the implant binary by name. src/main.cpp installs to
  C:\Windows\System32\WindowsSecurityUpdate.exe and the project deliberately
  masquerades as a Microsoft updater through resources/ghost.rc version info.
  There is no legitimate Microsoft binary named WindowsSecurityUpdate.exe in
  System32, so the name itself is the artifact - which is why this rule keys on
  the file name in a system directory instead of trying to fingerprint the
  binary's behaviour. A file *created* inside System32 by a non-installer
  process is the stronger signal of the two.
references:
  - https://attack.mitre.org/techniques/T1036/005/
  - https://attack.mitre.org/techniques/T1564/001/
author: kalidada18
date: 2026-10-07
tags:
  - attack.defense_evasion
  - attack.t1036.005
  - attack.t1564.001
logsource:
  product: windows
  service: sysmon
detection:
  selection_file_create:
    EventID: 11
    TargetFilename|contains: 'WindowsSecurityUpdate.exe'
  selection_process_create:
    EventID: 1
    Image|contains: 'WindowsSecurityUpdate.exe'
  selection_network:
    EventID: 3
    Image|contains: 'WindowsSecurityUpdate.exe'
  # A write into System32 is itself unusual; naming it here keeps the intent of
  # the rule legible to whoever scores the experiment.
  selection_system32_write:
    EventID: 11
    TargetFilename|startswith: 'C:\Windows\System32\'
    TargetFilename|endswith: '.exe'
  filter_installers:
    Image|endswith:
      - '\TiWorker.exe'
      - '\TrustedInstaller.exe'
      - '\msiexec.exe'
      - '\setup.exe'
      - '\Wuaueng.dll'
  condition: (selection_file_create or selection_process_create or selection_network or selection_system32_write) and not filter_installers
falsepositives:
  - Genuine Windows Update staging writes .exe files into System32 during
    servicing; filter_installers covers the common ones. The name-based arms
    have essentially no false positives because no shipping Microsoft binary
    uses this name.
  - Renaming the implant defeats every name-based arm. The behavioural rules
    (persistence, injection, beacon-from-unknown-image) are what survive a
    rename, which is the point of keeping them separate.
level: high
