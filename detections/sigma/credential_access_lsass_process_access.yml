title: GHOST Lab - LSASS Process Access With Read Rights From Unsigned Image
id: a5dd2831-ebd7-4c48-af9e-049e91c959bb
status: experimental
description: >
  Detects an image outside the Microsoft and signed-install paths opening
  lsass.exe with a mask that includes memory-read rights (0x1010 =
  QUERY_LIMITED_INFORMATION | VM_READ, 0x1410 adds QUERY_INFORMATION). That is
  the access step of src/privesc.cpp !lsass, which reads a bounded, fixed-size
  window of LSASS memory and reports statistics — it writes no dump and parses
  nothing, and this rule is written for the access pattern regardless of what a
  tool does with the bytes afterwards. The masks are logged by the collector's
  generic arms; the explicit lsass target arm exists so query-only variants from
  other tooling are captured too.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: kalidada18
date: 2026-10-08
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection_access:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
  filter_ms_source:
    SourceImage|startswith: 'C:\Windows\'
  filter_programfiles_signed:
    SourceImage|startswith:
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
  condition: selection_access and not filter_ms_source and not filter_programfiles_signed
falsepositives:
  - EDR agents and endpoint tooling read LSASS to inspect it — those usually run
    from Program Files or their own service directories; portable security tools
    and Task Manager variants from other paths will hit. Baseline first. On a
    lab VM, any hit outside the baseline is the implant.
level: high
