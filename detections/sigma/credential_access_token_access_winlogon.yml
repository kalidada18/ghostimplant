title: GHOST Lab - Token Theft Access To winlogon From Unsigned Image
id: de7c618a-6f62-4629-9058-900d2b6a0cdb
status: experimental
description: >
  Detects an image outside Microsoft and signed-install paths opening
  winlogon.exe with a token-query access mask. That is the access step of
  src/c2.cpp HandleStealToken: OpenProcess(winlogon, PROCESS_QUERY_INFORMATION
  0x400), OpenProcessToken, DuplicateTokenEx, ImpersonateLoggedOnUser. The
  token calls themselves emit nothing, which is why README section 16 recorded
  T1134.001 as a collector gap - the signal is the process-access event, and the
  durable part is the pair (target process, query-only mask), not the caller's
  file name. The full-access masks against other targets are covered by
  injection_remote_thread_svchost.yml's access arm; this rule exists because
  0x400 and 0x1000 are not among the masks that rule matches.
references:
  - https://attack.mitre.org/techniques/T1134/001/
author: kalidada18
date: 2026-10-08
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1134.001
logsource:
  product: windows
  service: sysmon
detection:
  selection_access:
    EventID: 10
    TargetImage|endswith: '\winlogon.exe'
    GrantedAccess:
      - '0x400'            # PROCESS_QUERY_INFORMATION — what HandleStealToken uses
      - '0x1000'           # PROCESS_QUERY_LIMITED_INFORMATION — the common variant
      - '0x410'            # + PROCESS_VM_READ
      - '0x1410'
  filter_ms_source:
    SourceImage|startswith: 'C:\Windows\'
  filter_programfiles_signed:
    SourceImage|startswith:
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
  condition: selection_access and not filter_ms_source and not filter_programfiles_signed
falsepositives:
  - Task Manager, Process Explorer and Process Hacker open winlogon with
    query-only rights from paths the filters above exclude, but portable copies
    do not. Endpoint agents and backup services running from ProgramData or
    %LOCALAPPDATA% will hit it. Baseline a clean snapshot, keep the winners as a
    suppression list, and score the experiment by the EID-10 timestamp against
    the task the operator sent.
level: high
